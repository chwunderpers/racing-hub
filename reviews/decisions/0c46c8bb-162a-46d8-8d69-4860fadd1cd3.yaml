    passages:
    - identity: a03-race-eligibility
      document_identity: fia:2026:section-a:03
      anchor: A2.2.1 opening condition
      language: en
      text: Race points depend on final classification and the leader's officially
        counted laps. The leader must complete two entire consecutive laps without
        a Safety Car or Virtual Safety Car procedure for any points to be awarded.
      kind: paraphrase
      translation: null
    - identity: a03-full-points
      document_identity: fia:2026:section-a:03
      anchor: A2.2.1(d), table column 4, first position
      language: en
      text: The full-points distance band begins at 75% of the Scheduled Race Distance.
        The first-position entry in that band is 25 points, subject to the article's
        opening eligibility condition.
      kind: paraphrase
      translation: null
    - identity: a03-dead-heat
      document_identity: fia:2026:section-a:03
      anchor: A2.2.3
      language: en
      text: For a race dead heat, the points for the tied positions are pooled and
        divided equally among those sharing the tie.
      kind: paraphrase
      translation: null
    - identity: b08-classification
      document_identity: fia:2026:section-b:08
      anchor: B2.5.5(c)
      language: en
      text: A published provisional race classification can be amended under the governing
        FIA rules; it is not by itself proof of the final points recipient.
      kind: paraphrase
      translation: null
    provisions:
    - identity: race-eligibility-a03
      passage_identity: a03-race-eligibility
      topic: scoring
      summary: Race points require the prescribed consecutive leader laps and final
        classification.
      applicability: Formula One 2026 race points under the fetched Section A Issue
        03. Historical issue applicability and actual event lap evidence have not
        been established.
      exceptions:
      - Fewer than two qualifying complete consecutive leader laps means no points
        under this condition.
      discretion: No independent discretion to replace the points table is established
        by this passage; actual decisions require separate evidence.
      amends: []
      effective_from: null
      effective_until: null
    - identity: full-points-winner-a03
      passage_identity: a03-full-points
      topic: scoring
      summary: A sole first-place finisher receives 25 points in the full-points distance
        band.
      applicability: Formula One 2026 race, final sole first-place classification,
        leader distance at least 75% of Scheduled Race Distance and the required consecutive
        laps without SC/VSC. This is a conditional rule, not an event award.
      exceptions:
      - Below 75% distance uses other bands, not this 25-point value.
      - A dead heat requires A2.2.3 rather than the sole-winner value.
      - Sprint allocation is outside this profile.
      discretion: Penalties, appeals or decisions changing classification or an award
        need their own reviewed evidence. Missing decision evidence does not establish
        that none exists.
      amends: []
      effective_from: null
      effective_until: null
    - identity: race-dead-heat-a03
      passage_identity: a03-dead-heat
      topic: scoring
      summary: Tied race positions share the combined points equally.
      applicability: A race dead heat under the fetched 2026 Section A Issue 03; not
        a season standings tie-break.
      exceptions:
      - The sole-winner 25-point answer cannot be applied unchanged to a tie.
      discretion: The actual tie and classification require official event evidence.
      amends: []
      effective_from: null
      effective_until: null
    - identity: classification-b08
      passage_identity: b08-classification
      topic: scoring
      summary: Provisional classification remains subject to amendment.
      applicability: Formula One 2026 classification under fetched Section B Issue
        08. It does not prove historical applicability to a named event.
      exceptions:
      - A provisional finishing order may differ from the final result.
      discretion: Review the applicable decision and final classification; this passage
        does not predict officials' decisions.
      amends: []
      effective_from: null
      effective_until: null
