      summary: Only the DMSB-approved German text is binding; incorporated rules and
        interpretation remain material.
      applicability: Authority context for this NLS 2026 evidence slice, not a complete
        sporting profile. Exact DMSB editions, amendments and event-specific applicability
        remain unresolved.
      exceptions:
      - Parallel English is a cross-check, not replacement authority.
      - The inventory's bounded B6-B8 scan concerns technical changes and found no
        direct Art. 24-25 change in extracted text; it is not a full amendment audit
        or proof of no indirect classification effect.
      - A1's June version predates B6-B8 approvals. Technical incorporation, rear-wing
        diagrams and deletion semantics were not fully audited.
      discretion: Interpretation involves the clerk/race director, stewards and organizer;
        final interpretation rests with DMSB sporting jurisdiction. No universal precedence
        ladder is inferred.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-calendar-scope-e03-a1
      passage_identity: nls-e03-a1
      topic: scoring
      summary: NLS-calendar events use series points rules; the Qualifiers retain
        their event regulations.
      applicability: Art. 4 in this consolidated A1 version; no historical applicability
        to a named race or actual event award is established.
      exceptions:
      - The Qualifiers' distinct event context and race completion must be checked
        separately.
      - No complete B1-B5 consolidation audit or complete amendment history is claimed.
      - The inventory's B6-B8 technical scan is not a full amendment audit; no direct
        Art. 24-25 amendment was identified in extracted text, but indirect classification
        effects remain possible.
      discretion: Applicable event regulations and official decisions require separate
        evidence. Empty amends lists mean no encoded relationship, not no amendments.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-calendar-scope-e03-b3
      passage_identity: nls-e03-b3
      topic: scoring
      summary: Bulletin 03's verified Art. 4 scoring-scope wording is present in A1.
      applicability: Bulletin 03 / 2026 Part 1 Art. 4, textually matched to A1 p.
        9. Issue date and event-specific commencement are unknown.
      exceptions:
      - The prior Art. 4 version is unavailable as a Provision; no fictional amendment
        target is created.
      - B3 does not amend the later A1 consolidation; the textual match is recorded
        without an amends edge.
      - This is not a full audit of B3's technical changes or all bulletins.
      discretion: Translation review does not establish event applicability. Approval
