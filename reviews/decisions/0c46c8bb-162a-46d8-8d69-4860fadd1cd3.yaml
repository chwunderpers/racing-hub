    - identity: nls-e06-a1
      document_identity: vln:2026:a1:2026-06-12
      anchor: p. 53 Art. 25.1.1 4h matrix and Art. 25.1.2 6h matrix
      language: en
      text: The allocation tables depend on actual class starters and final class
        rank. For class rank 1 and class-starter bands 1, 2, 3, 4, 5, 6, 7 or more,
        the full-points 4-hour awards are respectively 2, 3, 4, 6, 8, 11, 15; the
        full-points 6-hour awards are respectively 3, 4, 5, 8, 10, 14, 19. These are
        the complete winner rows, not the lower-rank rows. A one-starter class can
        score; seven starters is a field-size band, not a minimum eligibility threshold.
        No continuous formula or general points-rounding instruction is established
        by these allocation paragraphs.
