      anchor: pp. 53-54 Art. 25.2, discards and disqualification
      language: en
      text: For A-F, ten or nine completed races use the best eight results. Drivers/competitors/teams
        completing eight or fewer count those results without a discard. A completed
        counting race is a classified race in which that vehicle crossed the start
        line. A disqualification cannot be discarded. These season-total rules do
