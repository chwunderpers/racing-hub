    - identity: nls-e13-a1
      document_identity: vln:2026:a1:2026-06-12
      anchor: pp. 52-53 Art. 25.1, objections and corrections
      language: en
      text: Written objections to race or championship points must reach the organizer
        within 14 days of publication. The organizer may correct obvious errors after
        publication. Complaints go to the organizer, and this clause states no appeal
        against its points decision. Read with Art. 3.2, this is not unlimited authority
        to change regulations.
