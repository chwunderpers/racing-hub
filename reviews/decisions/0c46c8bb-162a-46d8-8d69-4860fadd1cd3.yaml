      language: en
      text: Stoppage classification refers to DMSB circuit Arts. 16.4 and/or 16.5.
        The last counted lap must end over the timing line under the vehicle's own
        engine power. The extracted restart clauses distinguish a leader below two
        laps from above two laps. Exactly two laps and the incorporated DMSB details
