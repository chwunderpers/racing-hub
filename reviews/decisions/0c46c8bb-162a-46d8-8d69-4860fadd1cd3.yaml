    - identity: nls-e12-a1
      document_identity: vln:2026:a1:2026-06-12
      anchor: p. 60 Art. 25.6.2, eligibility/race table/qualifying points
      language: en
      text: 'NLS Speed Trophy H is a separate award: registered competitors/teams
        identified by car start number score for top-20 overall race positions. Overall
        first receives 35 race points. Qualifying separately awards 3, 2, 1 points
        to the three fastest registered competitors/teams. The 35 is not an A-F driver/class-based
        award or necessarily the event total. Shortened-race treatment for H is not
        established by this passage.'
