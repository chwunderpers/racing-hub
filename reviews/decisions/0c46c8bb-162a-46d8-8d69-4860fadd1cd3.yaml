    - identity: nls-e11-a1
      document_identity: vln:2026:a1:2026-06-12
      anchor: p. 54 Art. 25.3, double-start allocation
      language: en
      text: A driver starting two cars nominates the car for driver-championship points
        on the signed double-starter list by Saturday 08:00; without nomination the
        lower start number is used. Class classifications separately count the placing
        in each of two different classes, or the better placing when both cars are
        in one class. This double-start exception does not establish division or duplication
        of points among co-drivers.
      kind: translation
