    - identity: nls-e07-a1
      document_identity: vln:2026:a1:2026-06-12
      anchor: p. 52 Art. 25.1, shortened/stopped-race duration bands a/b
      language: en
      text: If scheduled distance is shortened or a stopped race is not resumed, a
        4-hour race lasting up to 80 minutes has no classification; over 80 through
        160 minutes gives half points; over 160 minutes gives full points. For a 6-hour
        race, up to 120 minutes has no classification; over 120 through 250 minutes
        gives half points; over 250 minutes gives full points. The boundary is 250,
        not 240. These are duration bands within A-F allocation, not a 75% distance
        threshold; their application to G/H/I is not established here.
      kind: translation
