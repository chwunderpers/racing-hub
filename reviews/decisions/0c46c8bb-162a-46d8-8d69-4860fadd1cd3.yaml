      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-registration-e04
      passage_identity: nls-e04-a1
      topic: scoring
      summary: Championship points require received registration and fee; earlier
        results are excluded.
      applicability: A-I championship scoring prerequisites in this A1 version, subject
        to additional Cup/Trophy conditions; not general participation eligibility
        or an actual award.
      exceptions:
      - Nonregistered participants receive no championship points.
      - No automatic duplication or division of an award across a shared-car crew
        is established.
      discretion: Actual registration, receipt and recipient entitlement require separate
        evidence; none is assumed for a named entrant.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-class-rank-starters-e05
      passage_identity: nls-e05-a1
      topic: scoring
      summary: A-F scoring uses final class rank and actual class starters, not overall
        race rank or registered field size.
      applicability: NLS 2026 classifications A-F, including the annual overall championship,
        under this A1 version. Final class rank, actual starters and entitlement must
        be established for any event award.
      exceptions:
      - G/H/I are excluded from these A-F tables.
      - Nonregistered starters are not removed to promote registered participants.
      - Classification/sporting penalties may affect placing.
      discretion: Use official final class results and actual start evidence, including
        subsequent pit-lane starts. A provisional result or entry list is insufficient.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-class-winner-tables-e06
      passage_identity: nls-e06-a1
      topic: scoring
      summary: Full-points class-winner awards depend on race format and seven actual
        class-starter bands.
      applicability: Conditional A-F sole class winner, final class rank 1, eligible
        registered recipient and classified finish under this A1 version. For 1/2/3/4/5/6/7-or-more
        starters, 4h gives 2/3/4/6/8/11/15 and 6h gives 3/4/5/8/10/14/19 full points.
        No real event award is established.
      exceptions:
      - Shortened/stopped races require Art. 25.1 duration bands.
      - These winner rows do not encode lower-rank awards or an exact race dead heat.
      - Seven starters is not a minimum scoring threshold.
      - No continuous formula or fractional-award rounding rule is inferred.
      - This class-based award is not automatically equivalent to Formula One overall-winner
        points.
      discretion: The table does not establish independent discretion to replace awards.
        Verify final classification, penalties and applicable decisions.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-shortened-race-e07
      passage_identity: nls-e07-a1
      topic: scoring
      summary: A-F shortened/stopped races use duration bands for no classification,
        half points or full points.
      applicability: 'Scheduled distance shortened or stopped race not resumed: 4h
        up to 80 minutes has no classification, over 80 through 160 half points, over
        160 full; 6h up to 120 has no classification, over 120 through 250 half, over
        250 full. Actual duration and stoppage evidence remain unknown.'
      exceptions:
      - The 6h upper half-points boundary is 250 minutes, not 240.
      - No classification is the source condition, not a new profile knowledge state.
      - Do not replace duration bands with a 75% distance test or infer their application
        to G/H/I.
      - No rounding of fractional points is specified in this evidence slice.
      discretion: Race-control and classification evidence must establish the applicable
        band; no event outcome is inferred.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-classification-e08
      passage_identity: nls-e08-a1
      topic: scoring
      summary: Classification requires the 70% class-winner and 50% overall-winner
        distance tests plus finish conditions.
      applicability: 'Art. 24 in this A1 version: both commercially rounded distance
        thresholds, finish/timing line within 20 minutes, own-engine-power counted
        laps and finish, combined GP-course/Nordschleife final lap, and final results
        after technical checks and any proceedings.'
      exceptions:
      - Vehicles already in the pit lane when the leader is flagged are not classified;
        entering while flagged can use the extended timing line.
      - Equal distance is ordered by elapsed time including penalties; exact equal-distance/equal-time
        dead-heat allocation remains unknown.
      - Distance-threshold rounding is not evidence for points rounding.
      - No named vehicle's distance, finish, classification or points is established.
      discretion: Technical checks, penalties, protests and appeals can affect final
        results; applicable decisions require their own evidence.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-stoppage-e09
      passage_identity: nls-e09-a1
      topic: scoring
      summary: Stoppage classification incorporates DMSB circuit rules and requires
        an own-power last counted lap.
      applicability: NLS 2026 A1 Art. 18.5 and its DMSB Arts. 16.4/16.5 references;
        exact incorporated edition and event-specific application are unresolved.
      exceptions:
      - Exactly two leader laps is unresolved in the extracted below-two/above-two
        restart distinction.
      - The incorporated DMSB details were not established; this is not a complete
        restart or classification algorithm.
      discretion: Do not infer a race-control decision or complete award from this
        bounded passage alone.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-season-discards-e10
      passage_identity: nls-e10-a1
      topic: scoring
      summary: A-F season totals use best eight of nine or ten completed races; eight
        or fewer have no discard.
      applicability: Season totals under this A1 version, using classified counting
        races in which the vehicle crossed the start line; separate from the individual
        race table.
      exceptions:
      - A disqualification cannot be discarded.
      - No actual season race count or entrant's completed counting races are established.
      - An organizer report about season events is not a regulatory amendment or proof
        of a recipient's counting races.
      discretion: Actual season totals require the recipient's final classifications
        and applicable decisions; no total is calculated here.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-double-start-e11
      passage_identity: nls-e11-a1
      topic: scoring
      summary: Double-start driver points use a nominated car, with separate class-classification
        treatment.
      applicability: 'A driver starting two cars under this A1 version: signed nomination
        by Saturday 08:00, otherwise lower start number. Different classes count each
        placing; the same class uses the better placing.'
      exceptions:
      - This does not establish general shared-car crew entitlement, division or duplication
        of points.
      - No timezone conversion or actual nomination is inferred.
      discretion: The signed double-starter list and official classifications are
        required before attributing an award.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-speed-trophy-e12
      passage_identity: nls-e12-a1
      topic: scoring
      summary: Speed Trophy H awards 35 race points for overall first to an eligible
        registered competitor/team.
      applicability: 'Context only: separate NLS Speed Trophy H under Art. 25.6.2,
        identified by car start number. This is not an A-F driver/class-based award
        or an equivalent comparison category to Formula One driver race points.'
      exceptions:
      - Qualifying separately awards 3/2/1; 35 race points is not necessarily the
        event total.
      - H shortened-race treatment is unverified; do not apply A-F reductions by assumption.
      - No actual eligible team, overall winner or event award is established.
      discretion: Check separate Trophy eligibility and final results. The contextual
        35-point figure does not authorize an equivalence claim.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-points-corrections-e13
      passage_identity: nls-e13-a1
      topic: scoring
      summary: Points objections have a 14-day deadline and the organizer may correct
        obvious errors.
      applicability: Race/championship points under this A1 version; written objections
        within 14 days of publication. Read with Art. 3.2 interpretation context,
