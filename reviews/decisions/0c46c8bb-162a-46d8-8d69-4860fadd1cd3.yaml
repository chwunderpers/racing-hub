    provisions:
    - identity: nls-authority-e01
      passage_identity: nls-e01-a1
      topic: sporting
      summary: VLN organizer authority and DMSB approval are distinct; A1 approval
        dates conflict.
      applicability: NLS 2026 A1 as at 12 June 2026 (after Bulletin 5). The version
        date is not an issue or effective date; historical event applicability remains
        undefined.
      exceptions:
      - German Art. 2.3 prints 16 February 2025; parallel English prints 16 February
        2026. Neither is silently corrected.
      - Only English evidence is retained; original filenames in exact source URLs
        are provenance identifiers, not retained German rule bodies.
      discretion: The approval-date conflict remains unresolved after translation
        review. No reuse authorization is inferred from public availability or printed
        approval.
      amends: []
      effective_from: null
      effective_until: null
    - identity: nls-binding-text-e02
      passage_identity: nls-e02-a1
