    - identity: nls-e08-a1
      document_identity: vln:2026:a1:2026-06-12
      anchor: pp. 49-50 Art. 24, distance/finish/finality conditions
      language: en
      text: The winner completes the most laps; equal distances are ordered by shorter
        elapsed time including imposed time penalties. Classification requires at
        least 70% of the class winner's distance and 50% of the overall winner's distance,
        each commercially rounded, and crossing the finish/timing line within 20 minutes
        after the overall winner is flagged. Finish and counted laps must be under
        the vehicle's own engine power. The final lap must combine the GP course and
        Nordschleife. Vehicles entering the pit lane while being flagged can cross
        its extended timing line; those already in the pit lane when the leader is
        flagged are not classified. Results become final after technical checks and
        any protest/appeal proceedings. An exact equal-distance/equal-time dead heat
        is not resolved here.
      kind: translation
      translation:
        source_language: de
        method: assistant factual translation verified against PDF extraction
        version: nls-scoring-v1
        translated_at: '2026-09-11T06:58:19.265966Z'
