services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: motorsport
      POSTGRES_USER: motorsport
      POSTGRES_PASSWORD: motorsport
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorsport -d motorsport"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  graphdb:
    image: ontotext/graphdb:11.5.0
    environment:
      GDB_JAVA_OPTS: -Xms512m -Xmx1g -Dgraphdb.license.file=/run/secrets/graphdb.license
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7200/protocol"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:7200:7200"
    volumes:
      - graphdb-data:/opt/graphdb/home
      - type: bind
        source: ${GRAPHDB_LICENSE_FILE:?Set GRAPHDB_LICENSE_FILE to a valid GraphDB license file}
        target: /run/secrets/graphdb.license
        read_only: true

  bootstrap:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://packagefeedproxy.microsoft.io/pypi/simple/}
    command: ["python", "-m", "app.bootstrap"]
    environment:
      DATABASE_URL: postgresql://motorsport:motorsport@database:5432/motorsport
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: motorsport
      GRAPHDB_MAINTENANCE_USER: ${GRAPHDB_MAINTENANCE_USER:-}
      GRAPHDB_MAINTENANCE_PASSWORD: ${GRAPHDB_MAINTENANCE_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
      graphdb:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://packagefeedproxy.microsoft.io/pypi/simple/}
    environment:
      DATABASE_URL: postgresql://motorsport:motorsport@database:5432/motorsport
      GRAPHDB_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY: motorsport
      GRAPHDB_MAINTENANCE_USER: ${GRAPHDB_MAINTENANCE_USER:-}
      GRAPHDB_MAINTENANCE_PASSWORD: ${GRAPHDB_MAINTENANCE_PASSWORD:-}
      GRAPHDB_MCP_URL: http://graphdb:7200/mcp
      GRAPHDB_ASSISTANT_USER: ${GRAPHDB_ASSISTANT_USER:-}
      GRAPHDB_ASSISTANT_PASSWORD: ${GRAPHDB_ASSISTANT_PASSWORD:-}
      ASSISTANT_DATABASE_URL: ${ASSISTANT_DOCKER_DATABASE_URL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-https://admin-4138-resource.services.ai.azure.com/openai/v1/}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-6-astra}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres-data:
  graphdb-data: